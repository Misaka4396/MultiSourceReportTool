[project]
name = "multisource-report-tool"
version = "1.2.1"
description = "多源报告汇总推送工具 — 7 大信息源抓取 + 日报服务 + 文章抓取模块"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "fpdf2>=2.7.0",
    "lxml>=4.9.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
]

# 平铺布局多模块：显式声明，避免 setuptools flat-layout 自动发现报错
[tool.setuptools]
py-modules = ["main"]
packages = ["ui", "ui.pages", "fetchers", "report", "article_grab"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "responses>=0.25",
    "pyinstaller>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501"]  # 行宽由 black 保证，ruff 不重复报

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]  # 测试中允许裸 except 断言异常
# 历史抓取器/报告生成器：网络与解析异常类型不定，宽捕获后降级 mock 属设计意图
"fetchers/*" = ["BLE001"]
"report/pdf_writer.py" = ["BLE001"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 真实网络端到端测试（默认跳过，用 -m e2e 显式运行）",
]
addopts = "-ra --strict-markers"
